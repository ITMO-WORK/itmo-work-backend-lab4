server:
  port: 0
spring:
  servlet:
    multipart:
      max-file-size: 200MB
  application:
    name: application-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:9991}